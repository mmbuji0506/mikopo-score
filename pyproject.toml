[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikopo"
version = "0.1.0"
description = "MikopoScore - an end-to-end credit-risk scoring project (scorecard, validation, API, monitoring, data warehouse)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "mlflow-skinny>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
dashboard = ["streamlit>=1.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
